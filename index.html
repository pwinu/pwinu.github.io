
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pwin.lol</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #050505;
    color: #e8e8e8;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
  }

  #canvas {
    position: relative;
    width: 100%;
    min-height: 100vh;
    padding: 35px 20px;
  }

  .word {
    position: absolute;
    max-width: min(360px, 78vw);
    line-height: 1.5;
    overflow-wrap: anywhere;
    font-size: clamp(11px, 1.25vw, 15px);
    font-weight: normal;
    color: #d6d6d6;
    cursor: default;
    animation: appear 0.7s ease both;
    transition: color 0.2s;
  }

  .word:hover {
    color: #d3baff;
    z-index: 5;
  }

  .word:nth-child(5n) {
    color: #888;
  }

  .word:nth-child(7n) {
    font-size: clamp(14px, 1.7vw, 19px);
    color: #f2f2f2;
  }

  .word:nth-child(11n) {
    letter-spacing: 1px;
  }

  @keyframes appear {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @media (max-width: 600px) {
    #canvas {
      padding: 20px 12px;
    }

    .word {
      max-width: 75vw;
      font-size: 11px;
    }

    .word:nth-child(7n) {
      font-size: 13px;
    }
  }
</style>
</head>

<body>
<main id="canvas" aria-label="pwin's scattered thoughts"></main>

<script>
const phrases = [
  "pwin#11418",
  "5'7",
  "130 lbs",
  "brown hair",
  "brown eyes",
  "dimples",
  "long lashes",
  "mercy player",
  "not that mean",
  "listen to my voice messages",
  "read my stories",
  "listen to dolldamage",
  "have you ever laughed at me",
  "am i the only one that likes being scared",
  "skip that song",
  "are you close",
  "he is a yearner",
  "mama?",
  "i want to be good at video games",
  "sexy guy",
  "i failed my exams",
  "why dont you want to be my friend",
  "usually kidnapable",
  "maybe we did lose because i was on mercy",
  '"you are something"',
  '"eat a little something"',
  'our relationship is peak hypergamy..."what is that?"',
  '"girl youre just lesbian"',
  "im not what you accuse me of",
  "i bake btw",
  '"i never heard that name before"',
  "pee win",
  "you guys love bitching in a bitch's ear",
  "when the mercy says hello back",
  "i dont think that classifies as racism",
  "stare into someone's soul when they say theyre not into politics",
  "it's like you guys want me to be weird",
  "he made my favorite color pink",
  "why does he always pop noon when i valk",
  "the only reason i hate dying in ow is because i cant see him chasing after me anymore",
  "4r76",
  "nerf sierra",
  "i play with controller",
  "my bed is always empty. unless im in it. then its full of love. full of love.",
  "are you talking to me?",
  "okay, i should go. maybe ill type again later.",
  "bye? i hate leaving...."
];

const canvas = document.getElementById("canvas");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function placeWords() {
  canvas.innerHTML = "";

  const mobile = window.innerWidth < 600;
  const width = canvas.clientWidth;
  const gap = mobile ? 16 : 24;
  const margin = mobile ? 12 : 28;
  const maxWidth = Math.max(1, width - margin * 2);

  // A loose grid keeps phrases apart without making them look organized.
  const cellWidth = mobile ? 145 : 205;
  const cellHeight = mobile ? 95 : 105;
  const columns = Math.max(1, Math.floor(maxWidth / cellWidth));
  const rows = Math.ceil(phrases.length / columns) + 1;

  canvas.style.height = Math.max(
    window.innerHeight,
    rows * cellHeight + 100
  ) + "px";

  const cells = [];

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < columns; col++) {
      cells.push({ row, col });
    }
  }

  shuffle(cells);

  const shuffledPhrases = shuffle([...phrases]);

  shuffledPhrases.forEach((phrase, index) => {
    const cell = cells[index];
    const element = document.createElement("div");

    element.className = "word";
    element.textContent = phrase;

    const leftBase = margin + cell.col * (maxWidth / columns);
    const topBase = 30 + cell.row * cellHeight;

    const left = leftBase + Math.random() * Math.max(
      0, maxWidth / columns - cellWidth * 0.65
    );

    const top = topBase + Math.random() * (cellHeight - gap);

    element.style.left = Math.min(
      width - margin - cellWidth,
      Math.max(margin, left)
    ) + "px";

    element.style.top = top + "px";
    element.style.animationDelay = Math.random() * 0.6 + "s";

    canvas.appendChild(element);
  });

  // Move colliding words downward instead of letting them overlap.
  const elements = [...canvas.children];

  elements.forEach((element, index) => {
    let attempts = 0;

    while (attempts < 30) {
      const rect = element.getBoundingClientRect();

      const collision = elements.slice(0, index).some(other => {
        const previous = other.getBoundingClientRect();

        return !(
          rect.right + 12 < previous.left ||
          rect.left > previous.right + 12 ||
          rect.bottom + 12 < previous.top ||
          rect.top > previous.bottom + 12
        );
      });

      if (!collision) break;

      element.style.top =
        (parseFloat(element.style.top) + 24) + "px";

      attempts++;
    }
  });

  const bottom = Math.max(
    ...elements.map(element =>
      parseFloat(element.style.top) + element.offsetHeight
    )
  );

  canvas.style.height = Math.max(
    window.innerHeight,
    bottom + 100
  ) + "px";
}

let resizeTimer;

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(placeWords, 180);
});

placeWords();
</script>
</body>
</html>
